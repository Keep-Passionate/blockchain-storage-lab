services:
  mysql:
    image: mysql:8.4
    container_name: bsl-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trace_lab}
      MYSQL_USER: ${MYSQL_USER:-trace}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trace_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: bsl-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ipfs:
    image: ipfs/kubo:v0.31.0
    container_name: bsl-ipfs
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  mysql_data:
  redis_data:
  ipfs_data:
