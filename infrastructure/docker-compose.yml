# 文件功能：定义服务器端 IPFS、MySQL 和 Redis 开发依赖。
services:
  mysql:
    image: mysql:8.4
    container_name: bsl-mysql
    restart: unless-stopped
    environment:
      # 文件功能：所有值由 infrastructure/.env 显式提供，兼容服务器上的旧版 Compose。
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: bsl-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ipfs:
    # 服务器端实际运行的 Kubo IPFS；本地不启动此 Compose。
    image: ipfs/kubo:v0.43.1
    container_name: bsl-ipfs
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  mysql_data:
  redis_data:
  ipfs_data:
